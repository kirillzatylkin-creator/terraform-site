openapi: 3.0.3
info:
  title: API Terraform
  version: 1.0.0
  description: |
    API REST du projet Terraform (titre professionnel DWWM).
    Node.js / Express 5 / MySQL (`Terraform_db`).

    **Authentification** : `POST /auth/login` renvoie un jeton JWT (valable 2 h).
    Les routes protégées attendent l'en-tête `Authorization: Bearer <jeton>`.

    - sans jeton → `401 authorization required`
    - jeton modifié ou expiré → `401 invalid or expired token`
    - routes d'écriture (`POST`, `PUT`, `DELETE` sur `/games` et `/characters`) : rôle `admin` exigé, sinon `403 Forbidden`

    `/auth/login` et `/auth/register` sont limitées à 10 requêtes par 15 minutes et par adresse IP (`429`).
    Toute erreur interne renvoie `500 Erreur serveur` sans détail technique.
servers:
  - url: http://localhost:3000
    description: Développement local
tags:
  - name: Supervision
  - name: Authentification
  - name: Jeux
  - name: Personnages
  - name: Boutique
  - name: Contact

paths:
  /health:
    get:
      tags: [Supervision]
      summary: État du serveur et de la base
      description: Exécute `SELECT 1` sur MySQL.
      responses:
        '200':
          description: Serveur et base disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: connected }
        '500':
          description: Base injoignable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  database: { type: string, example: unreachable }

  /auth/register:
    post:
      tags: [Authentification]
      summary: Créer un compte
      description: Le mot de passe est haché avec bcrypt ; le rôle est toujours `user`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
            example: { username: test5, email: test5@test.com, password: MotDePasse1 }
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, example: 5 }
                  username: { type: string, example: test5 }
                  email: { type: string, example: test5@test.com }
        '400':
          description: |
            Données invalides. Messages possibles :
            `username, email and password necessary`, `Name must be at least 3 characters long`,
            `Invalid email format`, `Password must be at least 8 characters long`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Password must be at least 8 characters long }
        '409':
          description: E-mail déjà utilisé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: User with this email or username already exists }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [Authentification]
      summary: Se connecter
      description: Même réponse 401 que l'e-mail soit inconnu ou le mot de passe faux.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
            example: { email: test5@test.com, password: MotDePasse1 }
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: Champ manquant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: email and password necessary }
        '401':
          description: Identifiants incorrects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Invalid email or password }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/me:
    get:
      tags: [Authentification]
      summary: Profil de l'utilisateur connecté
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Utilisateur supprimé depuis la création du jeton
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: User not found }
        '500': { $ref: '#/components/responses/ServerError' }

  /games:
    get:
      tags: [Jeux]
      summary: Liste des jeux
      responses:
        '200':
          description: Tableau de jeux
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Game' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Jeux]
      summary: Créer un jeu (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameInput' }
            example: { title: Test, price: 10 }
      responses:
        '201':
          description: Jeu créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/GameInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /games/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Jeux]
      summary: Un jeu
      responses:
        '200':
          description: Le jeu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '404': { $ref: '#/components/responses/GameNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Jeux]
      summary: Modifier un jeu (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameInput' }
            example: { title: Test 2, price: 12 }
      responses:
        '200':
          description: Jeu modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/GameInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/GameNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Jeux]
      summary: Supprimer un jeu (admin)
      description: Supprime aussi ses personnages (`ON DELETE CASCADE`).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Jeu supprimé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: Game deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/GameNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /characters:
    get:
      tags: [Personnages]
      summary: Liste des personnages
      parameters:
        - name: game_id
          in: query
          required: false
          description: Filtrer par jeu
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Tableau de personnages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Character' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Personnages]
      summary: Créer un personnage (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterInput' }
            example: { game_id: 1, name: Test, role: Éclaireur, description: Personnage de test }
      responses:
        '201':
          description: Personnage créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Character' }
        '400':
          description: |
            Données invalides. Messages possibles : `game_id and name necessary`, `No game with such game_id`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: No game with such game_id }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /characters/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Personnages]
      summary: Un personnage (avec le titre de son jeu)
      responses:
        '200':
          description: Le personnage
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Character'
                  - type: object
                    properties:
                      game_title: { type: string, example: Terraform }
        '404': { $ref: '#/components/responses/CharacterNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Personnages]
      summary: Modifier un personnage (admin)
      description: Le jeu (`game_id`) ne peut pas être changé par cette route.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Chevalier du Voile }
                role: { type: string, nullable: true, example: Défenseur }
                description: { type: string, nullable: true }
      responses:
        '200':
          description: Personnage modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  role: { type: string, nullable: true }
                  description: { type: string, nullable: true }
        '400':
          description: Nom manquant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: name necessary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CharacterNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Personnages]
      summary: Supprimer un personnage (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Personnage supprimé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: Character deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CharacterNotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /products:
    get:
      tags: [Boutique]
      summary: Produits de la boutique
      responses:
        '200':
          description: Tableau de produits (triés par id)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '500': { $ref: '#/components/responses/ServerError' }

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Boutique]
      summary: Un produit
      responses:
        '200':
          description: Le produit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Produit introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Produit introuvable }
        '500': { $ref: '#/components/responses/ServerError' }

  /contact:
    post:
      tags: [Contact]
      summary: Envoyer un message
      description: Le message est enregistré dans la table `messages`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
            example:
              name: Cyrill
              email: test5@test.com
              subject: Question générale
              message: Bonjour, quand sort le prochain DLC ?
      responses:
        '201':
          description: Message enregistré
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, example: 12 }
        '400':
          description: |
            Données invalides. Messages possibles : `Tous les champs sont obligatoires`, `Champ trop long`,
            `Email invalide`, `Sujet invalide`, `Message trop court (10 caractères minimum)`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Message trop court (10 caractères minimum) }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton obtenu avec `POST /auth/login` (contient `id` et `role`, expire après 2 h).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Message:
      type: object
      properties:
        message: { type: string }

    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 150, description: Stocké dans la colonne `name` }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        user:
          type: object
          properties:
            id: { type: integer, example: 5 }
            username: { type: string, example: test5 }
            email: { type: string, example: test5@test.com }
            role: { type: string, enum: [user, admin], example: user }
    Me:
      type: object
      properties:
        id: { type: integer, example: 5 }
        name: { type: string, example: test5 }
        email: { type: string, example: test5@test.com }
        role: { type: string, enum: [user, admin] }

    Game:
      type: object
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: Terraform }
        description: { type: string, nullable: true }
        price: { type: number, minimum: 0, example: 59.99 }
    GameInput:
      type: object
      required: [title, price]
      properties:
        title: { type: string, minLength: 1, maxLength: 150, description: Texte non vide }
        description: { type: string, nullable: true }
        price: { type: number, minimum: 0, description: Nombre positif ou nul }

    Character:
      type: object
      properties:
        id: { type: integer, example: 1 }
        game_id: { type: integer, example: 1 }
        name: { type: string, example: Chevalier du Voile }
        role: { type: string, nullable: true, example: Défenseur · Combat rapproché }
        description: { type: string, nullable: true }
    CharacterInput:
      type: object
      required: [game_id, name]
      properties:
        game_id: { type: integer, description: Doit correspondre à un jeu existant }
        name: { type: string, maxLength: 150 }
        role: { type: string, nullable: true, maxLength: 100 }
        description: { type: string, nullable: true }

    Product:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Édition Standard }
        description: { type: string, nullable: true }
        price: { type: number, minimum: 0, example: 59.99 }
        category: { type: string, enum: [game, dlc, merch], example: game }
        image: { type: string, nullable: true, example: images/03-fond-chateau.webp }
        features:
          type: string
          nullable: true
          description: Éléments séparés par des retours à la ligne
          example: "Jeu de base\nContenus exclusifs\nSupport technique"

    ContactInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        subject:
          type: string
          enum: [Question générale, Signaler un bug, Demande de presse, Proposition, Autre]
        message: { type: string, minLength: 10, maxLength: 5000 }

  responses:
    Unauthorized:
      description: Jeton absent, modifié ou expiré
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            absent: { value: { error: authorization required } }
            invalide: { value: { error: invalid or expired token } }
    Forbidden:
      description: Utilisateur connecté sans rôle admin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Forbidden }
    TooManyRequests:
      description: Plus de 10 requêtes en 15 minutes depuis la même adresse IP
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Trop de tentatives, réessayez plus tard }
    ServerError:
      description: Erreur interne (détail uniquement dans les logs du serveur)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Erreur serveur }
    GameInvalid:
      description: |
        Données invalides. Messages possibles : `title invalide`, `price invalide (nombre positif)` ;
        `JSON invalide` si le corps n'est pas du JSON valide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: price invalide (nombre positif) }
    GameNotFound:
      description: Jeu introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Game not found }
    CharacterNotFound:
      description: Personnage introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Character not found }
